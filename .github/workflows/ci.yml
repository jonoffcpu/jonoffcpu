name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a pull request's build. Builds of main always finish: only they save the
# Gradle, configuration and Docker layer caches that every other build restores.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the change touches only documentation, as .github/changes-filter.yaml defines it. A pull request's files
  # come from the API; a push to main is compared with the commit before the push. A manual run builds everything.
  changes:
    name: Detect changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      # paths-filter lists a pull request's changed files through the API.
      pull-requests: read
    outputs:
      docs_only: ${{ steps.docs-only.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Only the counts are used, never the file names, so no file name reaches a shell.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: .github/changes-filter.yaml
          predicate-quantifier: some-with-excludes
      - name: Decide whether the change is documentation only
        id: docs-only
        env:
          ALL_COUNT: ${{ steps.filter.outputs.all_count }}
          DOCS_COUNT: ${{ steps.filter.outputs.docs_count }}
        run: |
          if [[ "${ALL_COUNT:-0}" -gt 0 && "$ALL_COUNT" == "$DOCS_COUNT" ]]; then
            docs_only=true
          else
            docs_only=false
          fi
          echo "Changed files: ${ALL_COUNT:-unknown}, documentation: ${DOCS_COUNT:-unknown}, documentation only: $docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  build-and-verify:
    name: Native build and verification
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    # The reusable workflow's setup-gradle comments on a pull request whose build fails.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/build-and-verify.yml
    with:
      native_artifact_prefix: native
      runnable_artifact_name: jonoffcpu-runnable-jars
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  # The README and docs pages against the correlator's parser, and their links. It runs for every change, so that a
  # documentation-only change, which skips the build, is still checked; the build runs the same test in jvmCheck.
  docs:
    name: Documentation check
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      # No submodules: the correlator reads only the async-profiler gitlink.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 25
      # As in build-and-verify.yml: caches are saved only from the default branch, and a failed build is summarized
      # on the pull request.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          build-scan-publish: true
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: "yes"
          add-job-summary-as-pr-comment: on-failure
      - name: Check the documentation
        run: ./gradlew :jonoffcpu-correlator:readmeTest --no-daemon

  # actionlint checks the workflows' syntax, expressions and shell scripts (with shellcheck), and
  # zizmor audits them for security problems such as template injection and excessive permissions.
  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run actionlint
        run: >-
          docker run --rm --volume "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true

  # The single status check that branch protection requires before a pull request can merge, so
  # adding or renaming jobs never changes the protection rule. It always runs and fails unless every
  # job it needs succeeded: a skipped job would otherwise let a skipped check count as passing. The one
  # accepted skip is the build of a documentation-only change.
  all-checks-passed:
    name: All checks passed
    needs:
      - changes
      - build-and-verify
      - docs
      - lint-workflows
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every needed job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          failed=$(jq -r --arg docs_only "$DOCS_ONLY" '
            to_entries[]
            | select(.value.result != "success")
            | select(.key != "build-and-verify" or .value.result != "skipped" or $docs_only != "true")
            | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [[ -n "$failed" ]]; then
            echo "Jobs that did not succeed:" >&2
            echo "$failed" >&2
            exit 1
          fi
          if [[ "$DOCS_ONLY" == "true" ]]; then
            echo "Documentation-only change: the build was skipped, and every other needed job succeeded."
          else
            echo "All needed jobs succeeded."
          fi

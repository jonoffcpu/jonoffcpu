name: Build and verify

on:
  workflow_call:
    inputs:
      version:
        description: Gradle project version used to build and test the Java artifacts
        required: false
        default: 1.0.0
        type: string
      native_artifact_prefix:
        description: Prefix for the per-architecture, per-libc native bundle artifacts
        required: true
        type: string
      runnable_artifact_name:
        description: Name of the artifact containing the agent and correlator JARs and the forked jfr-converter.jar
        required: false
        default: jonoffcpu-runnable-jars
        type: string

permissions:
  contents: read
  # setup-gradle comments on the pull request when its build fails.
  pull-requests: write

jobs:
  native-build-and-verify:
    name: Build and verify ${{ matrix.libc }} on ${{ matrix.name }}
    # One job per architecture and C library, so all four bundles build in
    # parallel on native runners. The bundle directory is linux-<arch> for glibc
    # and linux-musl-<arch> for musl, matching the agent's META-INF/native layout.
    strategy:
      fail-fast: false
      matrix:
        native-architecture: [x86_64, aarch64]
        libc: [glibc, musl]
        include:
          - native-architecture: x86_64
            name: Linux x86-64
            runner: ubuntu-26.04
            host-arch: x86_64
          - native-architecture: aarch64
            name: Linux arm64
            runner: ubuntu-26.04-arm
            host-arch: aarch64
          - libc: glibc
            bundle-prefix: linux
          - libc: musl
            bundle-prefix: linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ORG_GRADLE_PROJECT_version: ${{ inputs.version }}
    steps:
      - name: Verify native runner architecture
        env:
          EXPECTED_HOST_ARCH: ${{ matrix.host-arch }}
        run: test "$(uname -m)" = "$EXPECTED_HOST_ARCH"
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 25
      - uses: dtolnay/rust-toolchain@8d8cc9a8e0d47b64af669de71110e76860d6afbd # 1.91.0
        if: matrix.native-architecture == 'x86_64' && matrix.libc == 'glibc'
        with:
          components: rustfmt
      # The default (enhanced) cache provider is free for public repositories. It saves the Gradle User
      # Home, the local build cache included, only from the default branch; other runs restore it read-only.
      # Every build publishes a Build Scan, and a failed one is summarized on the pull request.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: "yes"
          add-job-summary-as-pr-comment: on-failure
      - name: Check native collector formatting
        if: matrix.native-architecture == 'x86_64' && matrix.libc == 'glibc'
        run: cargo +1.91.0 fmt --manifest-path jonoffcpu-native/Cargo.toml --all -- --check
      # The export's DuckDB checks run where DuckDB is on the path; one job is
      # enough, and only the x86-64 runner image ships Homebrew. They fail rather
      # than skip once JONOFFCPU_REQUIRE_DUCKDB is set.
      - name: Install DuckDB
        if: matrix.native-architecture == 'x86_64' && matrix.libc == 'glibc'
        run: |
          if ! command -v duckdb >/dev/null; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            brew install duckdb
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
            export PATH="$(brew --prefix)/bin:$PATH"
          fi
          duckdb --version
          echo "JONOFFCPU_REQUIRE_DUCKDB=true" >> "$GITHUB_ENV"
      # Docker layer caching in the GitHub Actions cache: a docker-container buildx
      # builder, which the native bundle and runtime image builds select through
      # BUILDX_BUILDER, and the Actions runtime environment that its gha cache
      # needs. The default builder stays in use for everything else. Layers are
      # restored on every run and exported only from the default branch, whose
      # cache every branch can read.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
        with:
          use: false
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      # check runs the unit tests and both kinds of integration tests. The
      # host-native ones load the bundle into the test JVM: directly for glibc,
      # and in an Alpine container of the same architecture for musl, whose
      # bundle cannot load into the glibc build JVM. The privileged-container
      # ones run the packaged agent and correlator end to end in Testcontainers
      # against the runner's kernel, in the Corretto image of the job's libc.
      - name: Build and run checks
        env:
          NATIVE_ARCHITECTURE: ${{ matrix.native-architecture }}
          NATIVE_LIBC: ${{ matrix.libc }}
          IN_CONTAINER: ${{ matrix.libc == 'musl' }}
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
          DOCKER_CACHE_WRITE: ${{ github.ref == 'refs/heads/main' }}
        run: >-
          ./gradlew :jonoffcpu-agent:check :jonoffcpu-correlator:check
          -PnativeArchitectures="$NATIVE_ARCHITECTURE"
          -PnativeLibcs="$NATIVE_LIBC"
          -PintegrationTestsInContainer="$IN_CONTAINER"
          -PdockerCache=gha
          -PdockerCacheWrite="$DOCKER_CACHE_WRITE"
          --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.native_artifact_prefix }}-${{ matrix.bundle-prefix }}-${{ matrix.native-architecture }}
          path: jonoffcpu-agent/build/native/${{ matrix.bundle-prefix }}-${{ matrix.native-architecture }}/
          if-no-files-found: error

  package:
    name: Package combined Java artifacts
    needs: native-build-and-verify
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      ORG_GRADLE_PROJECT_version: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 25
      # The default (enhanced) cache provider is free for public repositories. It saves the Gradle User
      # Home, the local build cache included, only from the default branch; other runs restore it read-only.
      # Every build publishes a Build Scan, and a failed one is summarized on the pull request.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: "yes"
          add-job-summary-as-pr-comment: on-failure
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.native_artifact_prefix }}-linux-x86_64
          path: jonoffcpu-agent/build/native/linux-x86_64
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.native_artifact_prefix }}-linux-aarch64
          path: jonoffcpu-agent/build/native/linux-aarch64
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.native_artifact_prefix }}-linux-musl-x86_64
          path: jonoffcpu-agent/build/native/linux-musl-x86_64
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.native_artifact_prefix }}-linux-musl-aarch64
          path: jonoffcpu-agent/build/native/linux-musl-aarch64
      - name: Package and verify all native bundles
        run: >-
          ./gradlew
          :jonoffcpu-agent:verifyRuntimeJar
          :jonoffcpu-correlator:verifyRuntimeJar
          :jonoffcpu-jfr-converter:check
          -PprebuiltNative=true
          -PnativeArchitectures=all
          -PnativeLibcs=all
          --no-daemon
      - name: Prepare downloadable JARs
        run: |
          mkdir workflow-downloads
          mapfile -t agent_jars < <(find jonoffcpu-agent/build/libs -maxdepth 1 -type f \
            -name 'jonoffcpu-agent-*.jar' ! -name '*-plain.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-test-fixtures.jar')
          mapfile -t correlator_jars < <(find jonoffcpu-correlator/build/libs -maxdepth 1 -type f \
            -name 'jonoffcpu-correlator-*.jar' ! -name '*-plain.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-test-fixtures.jar')
          mapfile -t converter_jars < <(find jonoffcpu-jfr-converter/build/libs -maxdepth 1 -type f \
            -name 'jonoffcpu-jfr-converter-*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-test-fixtures.jar')
          if [[ ${#agent_jars[@]} -ne 1 || ${#correlator_jars[@]} -ne 1 || ${#converter_jars[@]} -ne 1 ]]; then
            echo "Expected exactly one shaded JAR from each module" >&2
            printf 'Agent JARs: %s\n' "${agent_jars[*]}" >&2
            printf 'Correlator JARs: %s\n' "${correlator_jars[*]}" >&2
            printf 'Converter JARs: %s\n' "${converter_jars[*]}" >&2
            exit 1
          fi
          cp "${agent_jars[0]}" workflow-downloads/jonoffcpu-agent.jar
          cp "${correlator_jars[0]}" workflow-downloads/jonoffcpu-correlator.jar
          cp "${converter_jars[0]}" workflow-downloads/jfr-converter.jar
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.runnable_artifact_name }}
          path: workflow-downloads/*.jar
          if-no-files-found: error

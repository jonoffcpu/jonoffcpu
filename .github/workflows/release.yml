name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - name: Resolve release version
        id: release-version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ "$version" == "$RELEASE_TAG" ]]; then
            echo "Release tag must start with v: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Maven release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-and-verify:
    name: Native build and verification
    needs: version
    uses: ./.github/workflows/build-and-verify.yml
    with:
      version: ${{ needs.version.outputs.version }}
      native_artifact_prefix: release-native
      runnable_artifact_name: release-runnable-jars

  publish:
    name: Publish to Maven Central
    needs:
      - version
      - build-and-verify
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 25
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      - uses: actions/download-artifact@v8
        with:
          name: release-native-linux-x86_64
          path: jonoffcpu-agent/build/native/linux-x86_64
      - uses: actions/download-artifact@v8
        with:
          name: release-native-linux-aarch64
          path: jonoffcpu-agent/build/native/linux-aarch64
      - uses: actions/download-artifact@v8
        with:
          name: release-native-linux-musl-x86_64
          path: jonoffcpu-agent/build/native/linux-musl-x86_64
      - uses: actions/download-artifact@v8
        with:
          name: release-native-linux-musl-aarch64
          path: jonoffcpu-agent/build/native/linux-musl-aarch64
      - name: Publish and release Central Portal deployment
        env:
          ORG_GRADLE_PROJECT_version: ${{ needs.version.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signAllPublications: 'true'
        run: >-
          ./gradlew publishAndReleaseToMavenCentral
          -PprebuiltNative=true
          -PnativeArchitectures=all
          -PnativeLibcs=all
          --no-daemon
      # The reusable workflow built and checked the forked jfr-converter.jar that the publish
      # step above just published as jonoffcpu-jfr-converter.
      - uses: actions/download-artifact@v8
        with:
          name: release-runnable-jars
          path: verified-runnable-jars
      - name: Prepare GitHub Release downloads
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir release-downloads
          cp "jonoffcpu-agent/build/libs/jonoffcpu-agent-${RELEASE_VERSION}.jar" \
            release-downloads/jonoffcpu-agent.jar
          cp "jonoffcpu-correlator/build/libs/jonoffcpu-correlator-${RELEASE_VERSION}.jar" \
            release-downloads/jonoffcpu-correlator.jar
          cp verified-runnable-jars/jfr-converter.jar release-downloads/jfr-converter.jar
      - uses: actions/upload-artifact@v7
        with:
          name: jonoffcpu-release-downloads-${{ needs.version.outputs.version }}
          path: release-downloads/*.jar
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs:
      - version
      - publish
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jonoffcpu-release-downloads-${{ needs.version.outputs.version }}
          path: release-downloads
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            release-downloads/jonoffcpu-agent.jar \
            release-downloads/jonoffcpu-correlator.jar \
            release-downloads/jfr-converter.jar

  update-readme:
    name: Update README version numbers
    needs:
      - version
      - github-release
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Point the README at the released version
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sed -E -i \
            -e "s#(io\.github\.lhotari:jonoffcpu-(agent|correlator|jfr-converter):)[0-9A-Za-z.-]+#\1${RELEASE_VERSION}#g" \
            -e "s#(Pass a tag such as \`)v[0-9A-Za-z.-]+(\`)#\1${RELEASE_TAG}\2#" \
            README.md
          grep -q "jonoffcpu-agent:${RELEASE_VERSION}" README.md
          grep -q "jonoffcpu-correlator:${RELEASE_VERSION}" README.md
          grep -q "jonoffcpu-jfr-converter:${RELEASE_VERSION}" README.md
          grep -q "such as \`${RELEASE_TAG}\`" README.md
      - name: Commit and push
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- README.md; then
            echo "README already references ${RELEASE_TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update version numbers for latest release ${RELEASE_TAG} in README" -- README.md
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

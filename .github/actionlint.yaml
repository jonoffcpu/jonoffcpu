self-hosted-runner:
  # GitHub-hosted runner labels that actionlint does not know yet.
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm
paths:
  .github/workflows/release.yml:
    ignore:
      # actionlint's bundled metadata of actions/create-github-app-token predates its client-id
      # input, which replaces the deprecated app-id.
      - 'missing input "app-id" which is required by action "actions/create-github-app-token@v3"'
      - 'input "client-id" is not defined in action "actions/create-github-app-token@v3"'

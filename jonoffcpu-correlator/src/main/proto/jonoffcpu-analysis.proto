// SPDX-License-Identifier: MIT
//
// What the subcommands that work on a stack profile print: the `stacks --summary` file, the ranked
// tables of `top --format json`, the digest (jonoffcpu-summary.json), and `export`'s JSON Lines rows
// and run metadata. This schema is their single definition, printed through JsonFormat like the
// report (see jonoffcpu-report.proto). The Markdown and CSV views are rendered from these messages.
//
// Seconds, shares, weights and mean depths are exact decimals and are decimal strings. Values that
// echo a command-line option (--stack, --weights, --time, --package-names, --by, ...) keep the
// option's spelling.

syntax = "proto3";

package io.github.jonoffcpu.jonoffcpu.analysis.v1;

import "jonoffcpu-capture.proto";
import "jonoffcpu-profile.proto";
import "jonoffcpu-report.proto";

option java_package = "io.github.jonoffcpu.jonoffcpu.offline";
option java_outer_classname = "AnalysisProto";

// A pattern with where it came from: "inline", a file, or "preset:NAME".
message SourcedPattern {
  string pattern = 1;
  string source = 2;
}

// The frame transforms in effect, and, in a `stacks --summary`, what they did.
message Transforms {
  bool canonical_names = 1;
  repeated SourcedPattern hide = 2;
  repeated SourcedPattern trim_root = 3;
  repeated SourcedPattern root_at = 4;
  // "bucket" or "keep".
  string root_at_unmatched = 5;
  repeated SourcedPattern leaf_at = 6;
  repeated SourcedPattern collapse_leaf = 7;
  // "frame" or "category".
  string collapse_leaf_label = 8;
  // "none", "name" or "pool".
  string thread_frame = 9;
  // Set in a `stacks --summary`: the lines and the weight-averaged depth before and after.
  optional uint64 lines_before = 10;
  optional uint64 lines_after = 11;
  optional string frames_before = 12;
  optional string frames_after = 13;
  // Set with --root-at: the weight that had no application frame, and its share of the total.
  NoApplicationFrame no_application_frame = 14;
}

message NoApplicationFrame {
  string weight = 1;
  string share = 2;
}

// ---------------------------------------------------------------------------------------------------
// `stacks --summary`

message SliceSummary {
  // The selected reasons; every reason when --reason is all.
  repeated io.github.jonoffcpu.jonoffcpu.capture.v1.OffCpuReason reasons = 1;
  string stack = 2;
  string weights = 3;
  string time = 4;
  string package_names = 5;
  string reason_semantics = 6;
  uint64 intervals = 7;
  uint64 lines = 8;
  string total_nanos = 9;
  // The kept entries' time without a split: part of a total or split slice, left out of sleeping and runqueue.
  string unsplit_nanos = 10;
  repeated string include = 11;
  repeated string exclude = 12;
  // The stack kinds the filters searched.
  repeated string filter_scope = 13;
  // What the filters removed: add it back to reconcile with the unfiltered slice.
  FilteredSlice filtered = 14;
  string label = 15;
  uint32 sources = 16;
  Transforms transforms = 17;
}

message FilteredSlice {
  uint64 intervals = 1;
  string total_nanos = 2;
}

// `stacks --collapsed-input ... --summary`
message CollapsedSliceSummary {
  string package_names = 1;
  uint64 input_lines = 2;
  uint64 lines = 3;
  // In the input file's own unit.
  string total_weight = 4;
  repeated string include = 5;
  repeated string exclude = 6;
  FilteredLines filtered = 7;
  Transforms transforms = 8;
}

message FilteredLines {
  uint64 input_lines = 1;
  string total_weight = 2;
}

// ---------------------------------------------------------------------------------------------------
// `top --format json`

message TopResult {
  // The command that reproduces this result.
  string command = 1;
  // --by: "boundary", "self", "method", "class", "package" or "pool".
  string by = 2;
  // "seconds", "seconds per unit" (a comparison with --units), or "weight" (a collapsed input's unit).
  string unit = 3;
  TopSelection selection = 4;
  // A ranking's totals; unset for a comparison.
  TopTotals totals = 5;
  // Busy rows: by boundary, or by --by.
  repeated TopRow rows = 6;
  // --by boundary: busy time without an application frame, by pool.
  repeated TopRow no_application_frame = 7;
  repeated TopRow idle = 8;
  // A comparison with --baseline; unset for a ranking.
  ComparisonTotals comparison_totals = 9;
  repeated ComparedRow comparison = 10;
  repeated string warnings = 11;
}

message TopSelection {
  // The input: a profile and its run, or a collapsed file.
  optional string profile = 1;
  optional string run = 2;
  optional string collapsed_input = 3;
  // The selected reasons; empty for every reason.
  repeated io.github.jonoffcpu.jonoffcpu.capture.v1.OffCpuReason reasons = 4;
  string weights = 5;
  repeated SourcedPattern app = 6;
  repeated SourcedPattern idle = 7;
  repeated SourcedPattern machinery = 8;
  repeated string include = 9;
  repeated string exclude = 10;
  Transforms transforms = 11;
  string package_names = 12;
  uint32 limit = 13;
  // A comparison's baseline, and the units of work when time per unit is compared.
  TopInput baseline = 14;
  optional string units = 15;
  optional string baseline_units = 16;
}

message TopInput {
  string profile = 1;
  string run = 2;
}

message TopTotals {
  TableSum selected = 1;
  TableSum idle = 2;
  TableSum busy = 3;
  // --by boundary only.
  TableSum busy_application = 4;
  TableSum busy_no_application_frame = 5;
  // Idle entries with a lock-acquire frame: waits an idle list may hide by mistake.
  TableSum over_exclusion = 6;
}

message TableSum {
  uint64 entries = 1;
  // Intervals of a profile; lines of a collapsed input.
  uint64 intervals = 2;
  // In the result's unit, to three decimals.
  string value = 3;
}

message TopRow {
  uint32 rank = 1;
  // The boundary, the pool, or the --by key.
  string key = 2;
  // --by boundary: the entry frame of the wait machinery below the boundary, or the leaf.
  optional string blocker = 3;
  string value = 4;
  // Of the busy total, or of the idle total in the idle table.
  string share = 5;
  uint64 intervals = 6;
  // Set when the profile's estimate is available and observed weights are ranked.
  optional string estimated = 7;
  // Set when the profile has the sleeping/run-queue split.
  optional string sleeping = 8;
  optional string runqueue = 9;
  // The reason with the most weight; unset for a collapsed input.
  optional io.github.jonoffcpu.jonoffcpu.capture.v1.OffCpuReason reason = 10;
  // --by boundary: the heaviest root-most application frame.
  optional string caller = 11;
}

message ComparisonTotals {
  string baseline_busy = 1;
  string busy = 2;
  string baseline_busy_application = 3;
  string busy_application = 4;
}

message ComparedRow {
  uint32 rank = 1;
  string boundary = 2;
  // Unset on the side where the boundary does not occur.
  optional string baseline = 3;
  optional string value = 4;
  string delta = 5;
  optional string baseline_share = 6;
  optional string share = 7;
}

// ---------------------------------------------------------------------------------------------------
// The digest, jonoffcpu-summary.json; jonoffcpu-summary.md is rendered from it.

message Digest {
  string profile = 1;
  string run = 2;
  bool estimate_available = 3;
  bool time_split_available = 4;
  // From the correlation report, when there is one.
  DigestCapture capture = 5;
  TopSelection selection = 6;
  TopTotals where_the_time_went = 7;
  DigestTable busy = 8;
  // The pool table (with --app), or busy time by pool (without); unset when the profile has no threads.
  DigestTable busy_no_application_frame_by_pool = 9;
  DigestTable idle = 10;
  HeaviestStacks heaviest_stacks = 11;
  repeated string warnings = 12;
}

message DigestCapture {
  string session_id = 1;
  io.github.jonoffcpu.jonoffcpu.capture.v1.Sampling sampling = 2;
  uint64 source_rows = 3;
  uint64 matched = 4;
  uint64 source_rows_without_selected_jfr_sample = 5;
  uint64 orphan_jfr = 6;
  uint64 invalid_source = 7;
  uint64 invalid_jfr = 8;
  uint64 identity_unverified = 9;
  uint64 selected_observed_duration_nanos = 10;
  CollectorLoss loss = 11;
  io.github.jonoffcpu.jonoffcpu.report.v1.HandlerDelays handler_delay_nanos = 12;
  repeated io.github.jonoffcpu.jonoffcpu.capture.v1.OffCpuReason reasons = 13;
  io.github.jonoffcpu.jonoffcpu.report.v1.KernelSwitchOuts kernel_switch_outs = 14;
  io.github.jonoffcpu.jonoffcpu.report.v1.PopulationEstimate population_estimate = 15;
  repeated io.github.jonoffcpu.jonoffcpu.report.v1.DegradationStep degradation_steps = 16;
}

// The collector's selection and loss counters.
message CollectorLoss {
  uint64 selected_intervals = 1;
  uint64 sequence_contentions = 2;
  uint64 sequence_exhaustions = 3;
  uint64 ring_reserve_failures = 4;
  uint64 received_observations = 5;
  uint64 write_failures = 6;
  uint64 poll_failures = 7;
}

message DigestTable {
  // "boundary" with --app, "self" without, or "pool".
  string by = 1;
  string command = 2;
  repeated TopRow rows = 3;
}

message HeaviestStacks {
  string command = 1;
  uint64 lines = 2;
  string mean_depth = 3;
  // The ten heaviest lines.
  repeated HeavyStack top = 4;
}

message HeavyStack {
  string stack = 1;
  string seconds = 2;
}

// ---------------------------------------------------------------------------------------------------
// `export --format jsonl`: one row per profile entry.

message ExportRow {
  io.github.jonoffcpu.jonoffcpu.capture.v1.OffCpuReason reason = 1;
  uint32 task_state = 2;
  // Unset when the profile is not grouped by thread, or the thread is unknown.
  optional string thread = 3;
  // The stacks joined with ';', root first; unset for an absent stack.
  optional string java_stack = 4;
  optional string kernel_stack = 5;
  optional string user_stack = 6;
  uint64 intervals = 7;
  uint64 observed_nanos = 8;
  uint64 estimated_nanos = 9;
  uint64 sleeping_nanos = 10;
  uint64 runqueue_nanos = 11;
  uint64 unsplit_nanos = 12;
  uint64 estimated_sleeping_nanos = 13;
  uint64 estimated_runqueue_nanos = 14;
  uint64 estimated_unsplit_nanos = 15;
  // Each Java-stack frame's kind, "java" or "native", joined like java_stack.
  optional string java_stack_kinds = 16;
  // The same stacks as lists, root first; empty for an absent stack.
  repeated string java_frames = 17;
  repeated string java_frame_kinds = 18;
  repeated string kernel_frames = 19;
  repeated string user_frames = 20;
  optional string canonical_java_stack = 21;
  optional string thread_pool = 22;
  string run = 23;
  bool estimate_available = 24;
}

// `export --run-metadata`: one object describing the profile, joined to its rows on `run`.
message RunMetadata {
  string run = 1;
  string label = 2;
  repeated io.github.jonoffcpu.jonoffcpu.profile.v1.Provenance sources = 3;
  repeated string dimensions = 4;
  bool estimate_available = 5;
  bool time_split_available = 6;
  uint64 entries = 7;
  uint64 intervals = 8;
  string observed_nanos = 9;
}

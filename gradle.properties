version=1.0.0
# Reuse task outputs, such as compiled classes, generated protobuf code and javadoc, from earlier builds.
# In GitHub Actions the local build cache is part of the Gradle User Home that setup-gradle saves and restores.
org.gradle.caching=true
# Reuse the task graph of an earlier invocation with the same inputs, skipping configuration.
org.gradle.configuration-cache=true
# Configure only the projects a build needs; no project configures another.
org.gradle.configureondemand=true
org.gradle.parallel=true

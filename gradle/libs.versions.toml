# Every library and plugin version of the build, declared once.
[versions]
commonmark = "0.30.0"
protobuf = "4.36.1"
junit = "6.1.3"

[libraries]
gson = "com.google.code.gson:gson:2.14.0"
picocli = "info.picocli:picocli:4.7.7"
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-java-util = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }
protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }
snakeyaml = "org.yaml:snakeyaml:2.7"

# Test libraries. JUnit and Testcontainers are aligned by their BOMs, which every test suite imports as platforms.
assertj-core = "org.assertj:assertj-core:3.27.7"
# The Markdown renderer the Apache Pulsar launcher turns the digest into HTML with, for the digest's rendering tests.
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmark-ext-gfm-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }
commonmark-ext-heading-anchor = { module = "org.commonmark:commonmark-ext-heading-anchor", version.ref = "commonmark" }
awaitility = "org.awaitility:awaitility:4.3.0"
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-platform-console = { module = "org.junit.platform:junit-platform-console" }
testcontainers = { module = "org.testcontainers:testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-bom = "org.testcontainers:testcontainers-bom:2.0.5"

# Gradle plugins, as dependencies of the build-logic convention plugins that apply them.
maven-publish-plugin = "com.vanniktech:gradle-maven-publish-plugin:0.37.0"
protobuf-plugin = "com.google.protobuf:protobuf-gradle-plugin:0.10.0"
shadow-plugin = "com.gradleup.shadow:shadow-gradle-plugin:9.6.1"

[plugins]
spotless = { id = "com.diffplug.spotless", version = "8.10.2" }
